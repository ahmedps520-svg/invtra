# Local production-like stack: Postgres + web + worker.
#   cp .env.example .env   (set APP_SECRET, ADMIN_PASSWORD, …)
#   docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: invtra
      POSTGRES_PASSWORD: invtra
      POSTGRES_DB: invtra
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invtra"]
      interval: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://invtra:invtra@db:5432/invtra?schema=public
      INLINE_WORKER: "false"
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts && npm start"
    ports:
      - "3000:3000"
    volumes:
      - files:/app/storage
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://invtra:invtra@db:5432/invtra?schema=public
    command: npm run worker
    volumes:
      - files:/app/storage
    depends_on:
      - web

volumes:
  pgdata:
  files:
