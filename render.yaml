# Render Blueprint — https://render.com/docs/blueprint-spec
# Dashboard → New → Blueprint → pick this repo/branch. Creates the web service,
# Postgres and a persistent disk, and attaches invtra.store + www.invtra.store.
services:
  - type: web
    name: invtra
    runtime: docker
    plan: starter # a paid plan is required for the persistent disk
    region: frankfurt # closest Render region to the Gulf
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: invtra-storage
      mountPath: /app/storage
      sizeGB: 5
    domains:
      - invtra.store
      - www.invtra.store
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: invtra-db
          property: connectionString
      - key: APP_URL
        value: https://invtra.store
      - key: APP_SECRET
        generateValue: true
      - key: INLINE_WORKER # the queue worker runs inside the web service
        value: "true"
      - key: WORKER_CONCURRENCY
        value: "4"
      - key: STORAGE_DRIVER
        value: local
      - key: LOCAL_STORAGE_DIR
        value: /app/storage
      - key: ADMIN_EMAIL
        sync: false # you'll be asked for it when creating the Blueprint
      - key: ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP_APP_SECRET
        generateValue: true # replace with your Meta App Secret when connecting WhatsApp
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      # ── Preview mode: no real WhatsApp messages or payments until you connect them ──
      - key: WHATSAPP_PROVIDER
        value: mock
      - key: PAYMENT_PROVIDER
        value: mock
      - key: ALLOW_MOCK_IN_PRODUCTION
        value: "true"
      - key: SEED_DEMO
        value: "true"

databases:
  - name: invtra-db
    plan: basic-256mb
    region: frankfurt
    databaseName: invtra
    user: invtra
